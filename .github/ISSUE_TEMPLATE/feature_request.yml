name: Feature request
description: 建议一个新能力或改进
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景、当前阻碍和目标用户。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望的交互、接口或配置方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 已尝试的做法、相关项目或需要权衡的点。
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我已搜索现有 Issue 和 Roadmap。
          required: true
